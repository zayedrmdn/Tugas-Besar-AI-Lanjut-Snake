[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turn-based-snake"
version = "1.0.0"
description = "A configurable turn-based Pygame Snake assignment template"
requires-python = ">=3.11"
dependencies = ["pygame>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["snake_game*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

